name: All Brands Monitor

on:
  schedule:
    - cron: '0 0 1,16 * *' # 每月 1 号和 16 号自动运行
  workflow_dispatch:        # 允许随时手动点击运行

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 赋予读写权限，彻底解决 128 报错
    steps:
      - name: 检查代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行爬虫脚本
        run: python scraper.py

      - name: 自动提交并保存 CSV 历史文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add all_brands_lampen_history.csv
          if git diff --cached --quiet; then
            echo "没有发现数据变动，跳过提交。"
          else
            git commit -m "Auto-update all brands data: $(date +'%Y-%m-%d')"
            git push
          fi
