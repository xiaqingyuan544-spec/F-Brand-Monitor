name: All Brands Monitor
on:
  schedule:
    - cron: '0 0 1,16 * *' # 每月 1 号和 16 号自动运行
  workflow_dispatch:        # 允许随时手动点击运行

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python scraper.py
      - name: Commit CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add all_brands_lampen_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update all brands data" && git push)
